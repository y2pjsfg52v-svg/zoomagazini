<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Зоомагазини – проследяване на посещенията</title>
<style>
:root{--bg:#f7f8f4;--surface:#fff;--text:#1f2420;--muted:#667068;--line:#dfe3dc;--head:#edf0e8;--accent:#2f7d4f;--accent-bg:#e3f2e9;--on-accent:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161a17;--surface:#1e2320;--text:#e8ebe6;--muted:#9aa39b;--line:#323935;--head:#262c28;--accent:#5fbf86;--accent-bg:#1f3b2c;--on-accent:#0f1a13}}
:root[data-theme="dark"]{--bg:#161a17;--surface:#1e2320;--text:#e8ebe6;--muted:#9aa39b;--line:#323935;--head:#262c28;--accent:#5fbf86;--accent-bg:#1f3b2c;--on-accent:#0f1a13}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1100px;margin:0 auto;padding:16px 12px 24px}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.bar input[type=search]{flex:1 1 180px;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);font:inherit}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--text);padding:9px 12px;font:inherit;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.stat{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:4px}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:12px}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.wrap{overflow:auto;max-height:68dvh;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{position:sticky;top:0;z-index:2;background:var(--head);font-size:13px;white-space:nowrap}
td.num{color:var(--muted);width:44px}
td.nm{font-weight:600;min-width:170px}
tr.done td{background:var(--accent-bg)}
.tog{min-width:56px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:inherit;font-weight:600;cursor:pointer}
tr.done .tog{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
textarea{width:100%;min-width:220px;min-height:36px;resize:none;overflow:hidden;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
textarea:focus,.bar input:focus{outline:2px solid var(--accent);outline-offset:0}
.acct{display:flex;flex-direction:column;gap:2px;margin:0 0 8px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:13px}
.acct b{font-size:14px}
#st{color:var(--muted)}
.tools{display:flex;gap:8px;margin:0 0 8px}
.tools button{flex:1;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);font:inherit;font-size:14px;cursor:pointer}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.tog{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.nav{color:var(--accent);text-decoration:none;-webkit-tap-highlight-color:transparent}
.nav span{display:inline-block;margin-left:6px;padding:2px 10px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:600;white-space:nowrap}
@media (max-width:700px){
main{padding:8px 10px 32px}
h1{font-size:18px}
.sub{font-size:13px;margin-bottom:8px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:6px 0 2px}
.bar input[type=search]{flex:1 1 100%;font-size:16px;padding:11px 12px}
.seg{width:100%}
.seg button{flex:1;padding:11px 6px;font-size:15px}
.wrap{max-height:none;overflow:visible;border:0;background:none;border-radius:0}
table,tbody{display:block;min-width:0}
thead{display:none}
tr{display:grid;grid-template-columns:1fr auto;grid-template-areas:"num tog" "nm nm" "ad ad" "nt nt";gap:4px 10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
tr[hidden]{display:none}
tr.done{background:var(--accent-bg);border-color:var(--accent)}
td,tr.done td{display:block;padding:0;border:0;background:none;min-width:0}
td.num{grid-area:num;align-self:center;font-size:13px;width:auto}
td.num::before{content:"№ "}
td.tg{grid-area:tog}
td.nm{grid-area:nm;font-size:16px;min-width:0}
td.ad{grid-area:ad;font-size:15px}
.nav{display:block;padding:6px 0}
.nav span{padding:5px 12px;font-size:13px}
td.nt{grid-area:nt;margin-top:6px}
.tog{min-height:42px;padding:8px 14px;font-size:15px}
.tog::before{content:"Посетен: "}
textarea{min-width:0;min-height:44px;font-size:16px}
}
[hidden]{display:none!important}
.card{display:flex;flex-direction:column;gap:10px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:12px}
.card input{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit;font-size:16px;width:100%}
.card button{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);font:inherit;cursor:pointer}
.card .pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.card .row{display:flex;gap:8px}.card .row button{flex:1}
.card .lnk{border:0;background:none;color:var(--accent);padding:4px}
#er{color:#e5604f;font-size:13px;min-height:1em}
.loc{display:flex;flex-direction:column;gap:8px;margin:0 0 10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.loc b{font-size:14px}
.loc .seg button{flex:1;padding:10px 6px;font-size:14px}
.loc .row{display:flex;gap:8px}
.loc input{flex:1;min-width:0;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit;font-size:16px}
.loc .act{padding:11px 14px;border:1px solid var(--accent);border-radius:10px;background:var(--accent);color:var(--on-accent);font:inherit;font-weight:600;cursor:pointer}
.loc #la .act{width:100%}
.loc .lnk{border:0;background:none;color:var(--accent);padding:2px 0;font:inherit;font-size:13px;cursor:pointer;text-align:left}
#ls{font-size:13px;color:var(--muted)}
.loc .prog{margin:0}
.dist{display:inline-block;margin-left:8px;font-size:13px;color:var(--muted);white-space:nowrap}
</style>
</head>
<body>
<main>
<h1>Зоомагазини – проследяване на посещенията</h1>
<div class="acct"><b id="who">Проверка на профила…</b><span id="st"></span></div>
<form id="auth" class="card" hidden>
<b>Вход в профил</b>
<input type="email" id="em" placeholder="Имейл" autocomplete="username" required>
<input type="password" id="pw" placeholder="Парола" autocomplete="current-password">
<div class="row"><button type="submit" class="pri">Вход</button><button type="button" id="reg">Регистрация</button></div>
<button type="button" id="gg">Вход с Google</button>
<button type="button" id="fg" class="lnk">Забравена парола?</button>
<div id="er" role="alert"></div>
</form>
<div id="app" hidden><div class="tools"><button type="button" id="bk">Запази копие</button><button type="button" id="out" hidden>Изход</button><button type="button" id="rs">Върни копие</button><input type="file" id="fl" accept=".json,application/json" hidden></div>
<p class="sub">Натисни „Не“, за да отбележиш магазина като посетен. Записвай резултат, контакт или следващи действия в бележките.</p>
<div class="loc">
<b>Начална точка</b>
<div class="seg" id="lm"><button type="button" data-m="auto" class="on">Автоматично (GPS)</button><button type="button" data-m="man">Ръчно</button></div>
<div id="la"><button type="button" class="act" id="go">Определи моята локация</button></div>
<div class="row" id="lmn" hidden><input type="search" id="adr" placeholder="Адрес или квартал, напр. Люлин 5" aria-label="Начален адрес"><button type="button" class="act" id="fd">Търси</button></div>
<div id="ls"></div>
<div class="prog" id="gp" hidden><i id="gpi"></i></div>
<button type="button" class="lnk" id="clr" hidden>Изчисти началната точка</button>
</div>
<div class="top"><div class="bar">
<input type="search" id="q" placeholder="Търси по фирма или адрес…" aria-label="Търсене">
<div class="seg" id="seg"><button data-m="all" class="on">Всички</button><button data-m="no">Непосетени</button><button data-m="yes">Посетени</button></div>
</div>
<div class="stat"><span id="cnt"></span><span id="pct"></span></div>
<div class="prog"><i id="pg"></i></div></div>
<div class="wrap"><table>
<thead><tr><th>№</th><th>Посетен?</th><th>Зоомагазин / фирма</th><th>Адрес</th><th>Описание / бележки</th></tr></thead>
<tbody id="tb"></tbody>
</table></div>

</div></main>
<script>

], [79, "ЗОО МЕНЮ ООД", "ул. Йерусалим, бл. 51"], [80, "ЗОО ЗОНА БГ", "ул. Тирана, зад бл. 50"], [81, "БГПЕТ ООД", "бул. Самоковско шосе, Горубляне, до Promarket"], [82, "ЕТ ВЕГА Н ВЕРА ИЛИЕВА", "ул. Рибарица 8"], [83, "ЛЮНЕЛ 2009 ООД", "ул. Милин камък 9, ветеринарна клиника"], [84, "РИНТИ 2014", "ул. Мудрен 27"], [85, "МОНИ ТРЕЙД 2014 ЕООД", "ул. Иван Асен II 9"], [86, "ДАНИ 63 ЕООД", "бул. Шипченски проход 18"], [87, "СУРИКАТИТЕ 2020 ЕООД", "бул. Шипченски проход 18"], [88, "ЗМ ГРАНД ООД", "ул. Мадрид 56"], [89, "МАГИ НАЧЕВА ООД", "ул. Станислав Доспевски 65"], [90, "ПЕТСЕНС ООД", "ул. Гео Милев 153, магазин 1"], [91, "КРИСТИЯН ТРЕЙД 15 ООД", "ул. Атанас Москов, бл. 425"], [92, "ДАНИ 63 ЕООД", "ул. Николай Коперник 25"]];

const tb=$('tb');
function grow(t){t.style.height='auto';t.style.height=Math.max(36,t.scrollHeight)+'px'}
function paint(tr){

function build(){

function refresh(){
  const q=$('q').value.trim().toLowerCase();

  tb.querySelectorAll('tr').forEach(tr=>{

function setStatus(s){$('st').textContent=s}
function save(){

  clearTimeout(timer);
  timer=setTimeout(()=>{
    chain=chain.then(()=>store.set({v:state.v,n:state.n})).then(()=>setStatus('Запазено в профила ти.')).catch(()=>{store=null;setStatus('Запазено само на това устройство.')});
  },700);
}
$('q').addEventListener('input',refresh);
$('seg').addEventListener('click',e=>{

async function backup(){
  const data=JSON.stringify({app:'zoomagazini',date:new Date().toISOString(),v:state.v,n:state.n},null,2);
  const name='zoomagazini-kopie-'+new Date().toISOString().slice(0,10)+'.json';

function restore(file){
  const r=new FileReader();
  r.onload=()=>{try{
    const d=JSON.parse(r.result);if(!d||typeof d.v!=='object'||typeof d.n!=='object')throw 0;
    state.v={...d.v};state.n={...d.n};DATA.forEach(([n])=>touched.add(n));

  }catch(e){setStatus('Файлът не е валидно копие от това приложение.')}};
  r.readAsText(file);
}
$('bk').onclick=backup;$('rs').onclick=()=>$('fl').click();
$('fl').onchange=e=>{const f=e.target.files[0];if(f)restore(f);e.target.value=''};
/* ====== Близост: начална точка и подреждане ====== */
const GK='zoo-geo-v1',OKY='zoo-origin-v1';
let geo={},origin=null,gbusy=false;
try{geo=JSON.parse(localStorage.getItem(GK)||'{}')||{}}catch(e){}
try{origin=JSON.parse(localStorage.getItem(OKY)||'null')}catch(e){}
const sleep=ms=>new Promise(r=>setTimeout(r,window.__GEO_DELAY??ms));
const setLs=t=>{$('ls').textContent=t};
const saveGeo=()=>{try{localStorage.setItem(GK,JSON.stringify(geo))}catch(e){}};
function hav(a,b){const t=x=>x*Math.PI/180,dl=t(b[0]-a[0]),dn=t(b[1]-a[1]);const h=Math.sin(dl/2)**2+Math.cos(t(a[0]))*Math.cos(t(b[0]))*Math.sin(dn/2)**2;return 12742*Math.asin(Math.sqrt(h))}
const fmt=d=>d<1?Math.round(d*100)*10+' м':(Math.round(d*10)/10).toString().replace('.',',')+' км';
async function nom(q){
  const u='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=bg&accept-language=bg&viewbox=23.15,42.83,23.52,42.55&q='+encodeURIComponent(q);
  const r=await fetch(u);if(!r.ok)throw new Error('http'+r.status);
  const j=await r.json();return j.length?[+j[0].lat,+j[0].lon]:null;
}
function queries(addr){
  const c=addr.replace(/(?:^|[\s,])(?:бл|вх|ет|ап)\.\s*[^\s,]+/gi,'').replace(/,\s*(?:магазин|обект|ветеринарна|спирка)[^,]*/gi,'').replace(/,\s*(?:до|зад)(?=\s|,|$)[^,]*/gi,'').replace(/,(\s*,)+/g,',').replace(/\s+/g,' ').replace(/^[,\s]+|[,\s]+$/g,'');
  const b=c.replace(/(?:ж\.к\.|кв\.|ул\.|бул\.|пл\.)\s*/gi,'').replace(/№\s*\d+/g,'').replace(/\s\d+[А-Яа-яA-Za-z]?(?=,|$)/g,'').replace(/,(\s*,)+/g,',').replace(/^[,\s]+|[,\s]+$/g,'');
  return [c+', София',b+', София'];
}
const dist=id=>{const g=geo[id];return(g&&origin)?hav(origin,g):Infinity};
let pendSort=false;
tb.addEventListener('focusout',()=>{if(pendSort){pendSort=false;setTimeout(sortList,0)}});
function sortList(){
  const ae=document.activeElement;if(ae&&ae.tagName==='TEXTAREA'&&tb.contains(ae)){pendSort=true;return}
  const rows=[...tb.children];
  rows.sort((a,b)=>{
    const x=+a.dataset.id,y=+b.dataset.id;
    if(!origin)return x-y;
    const va=!!state.v[x],vb=!!state.v[y];
    if(va!==vb)return va?1:-1;
    const dx=dist(x),dy=dist(y);
    if(dx===dy)return x-y;
    return dx<dy?-1:1;
  });
  rows.forEach(r=>{tb.appendChild(r);const d=dist(r.dataset.id);r.querySelector('.dist').textContent=d===Infinity?'':'≈ '+fmt(d)});
}
function updLs(){
  $('clr').hidden=!origin;
  if(!origin){setLs('Избери начална точка и ще подредя непосетените от най-близките към най-далечните.');return}
  const ok=DATA.filter(r=>geo[r[0]]).length;
  setLs('Подредено спрямо: '+origin[2]+'. Адреси, намерени на картата: '+ok+' от '+DATA.length+'. Разстоянията са по права линия.');
}
async function geocodeAll(){
  if(gbusy)return;
  const todo=DATA.filter(r=>!(r[0] in geo));
  if(!todo.length)return;
  gbusy=true;$('gp').hidden=false;
  const ac={};DATA.forEach(r=>{if(geo[r[0]]!==undefined)ac[r[2]]=geo[r[0]]});
  let i=0,failed=false;
  try{
    for(const [n,,addr] of todo){
      i++;$('gpi').style.width=(i/todo.length*100)+'%';
      setLs('Определям адресите на картата: '+i+' от '+todo.length+'…');
      if(addr in ac){geo[n]=ac[addr];continue}
      let p=null;
      for(const q of queries(addr)){p=await nom(q);await sleep(1100);if(p)break}
      geo[n]=ac[addr]=p;
      if(i%6===0){saveGeo();sortList()}
    }
  }catch(e){failed=true;setLs('Услугата за карти не отговаря. Подредени са само вече намерените адреси – опитай пак по-късно.')}
  saveGeo();gbusy=false;$('gp').hidden=true;sortList();
  if(!failed)updLs();
}
async function setOrigin(o){
  origin=o;try{localStorage.setItem(OKY,JSON.stringify(o))}catch(e){}
  updLs();sortList();await geocodeAll();
}
$('lm').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  $('lm').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
  $('la').hidden=b.dataset.m!=='auto';$('lmn').hidden=b.dataset.m!=='man';
};
$('go').onclick=()=>{
  if(!navigator.geolocation){setLs('Този браузър не поддържа определяне на локация.');return}
  setLs('Определям локацията ти…');
  navigator.geolocation.getCurrentPosition(
    p=>setOrigin([p.coords.latitude,p.coords.longitude,'моята локация']),
    e=>setLs(e.code===1?'Нямам достъп до локацията. Разреши я за този сайт в настройките на браузъра или избери „Ръчно“.':'Не успях да определя локацията. Опитай пак или избери „Ръчно“.'),
    {enableHighAccuracy:true,timeout:15000,maximumAge:60000});
};
async function findManual(){
  const t=$('adr').value.trim();if(!t)return;
  setLs('Търся адреса…');
  try{
    let p=await nom(/софи/i.test(t)?t:t+', София');
    if(!p)p=await nom(t);
    if(!p){setLs('Не намерих този адрес. Опитай по-подробно – улица и номер или квартал.');return}
    await setOrigin([p[0],p[1],t]);
  }catch(e){setLs('Услугата за карти не отговаря. Опитай пак след малко.')}
}
$('fd').onclick=findManual;
$('adr').addEventListener('keydown',e=>{if(e.key==='Enter')findManual()});
$('clr').onclick=()=>{origin=null;try{localStorage.removeItem(OKY)}catch(e){}updLs();sortList()};
$('seg').addEventListener('click',()=>{if(origin)sortList()});
updLs();if(origin){sortList();geocodeAll()}
/* ====== НАСТРОЙКА НА FIREBASE: попълни стойностите от Firebase конзолата ====== */
const FIREBASE_CONFIG={apiKey:"AIzaSyCjMjfClxWJg2lXU4zaJ-8yjVFnHIYheZs",authDomain:"zoomagazini-f8cc3.firebaseapp.com",projectId:"zoomagazini-f8cc3",appId:"1:221752103662:web:b196fe5ea4cd6d005019ff"};
/* ============================================================================== */
const FBV='10.14.1',FB='https://www.gstatic.com/firebasejs/'+FBV+'/';
function hasLocal(){return Object.keys(state.v).length||Object.keys(state.n).length}
function resetLocal(){state.v={};state.n={};touched.clear();try{localStorage.removeItem(LS);localStorage.removeItem('zoo-uid')}catch(e){}tb.querySelectorAll('tr').forEach(paint);refresh()}
function localMode(why){$('who').textContent='Локален режим';setStatus(why+' Данните са само на това устройство – ползвай „Запази копие“.');$('app').hidden=false;$('out').hidden=true}
async function initCloud(){
  if(!FIREBASE_CONFIG.apiKey){localMode('Firebase още не е настроен.');return}
  if(!/^https?:$/.test(location.protocol)){localMode('Входът работи само от интернет адрес (https), не от файл или преглед.');return}
  let AP,AU,FS;
  try{[AP,AU,FS]=await Promise.all([import(FB+'firebase-app.js'),import(FB+'firebase-auth.js'),import(FB+'firebase-firestore.js')])}
  catch(e){localMode('Firebase не се зареди – провери интернет връзката.');return}
  const app=AP.initializeApp(FIREBASE_CONFIG),auth=AU.getAuth(app),fs=FS.getFirestore(app);
  const em=$('em'),pw=$('pw'),er=$('er');
  const M={'auth/invalid-credential':'Грешен имейл или парола.','auth/email-already-in-use':'Този имейл вече е регистриран.','auth/weak-password':'Паролата трябва да е поне 6 символа.','auth/invalid-email':'Невалиден имейл.','auth/missing-password':'Въведи парола.','auth/popup-closed-by-user':'Входът е отказан.','auth/network-request-failed':'Няма интернет връзка.','auth/unauthorized-domain':'Този адрес не е добавен в Authorized domains във Firebase.'};
  const fail=e=>{er.textContent=M[e.code]||'Грешка: '+(e.code||e.message)};
  const run=async f=>{er.textContent='';try{await f()}catch(e){fail(e)}};
  $('auth').onsubmit=ev=>{ev.preventDefault();run(()=>AU.signInWithEmailAndPassword(auth,em.value.trim(),pw.value))};
  $('reg').onclick=()=>run(()=>AU.createUserWithEmailAndPassword(auth,em.value.trim(),pw.value));
  $('gg').onclick=()=>run(()=>AU.signInWithPopup(auth,new AU.GoogleAuthProvider()));
  $('fg').onclick=()=>run(async()=>{if(!em.value.trim()){er.textContent='Първо въведи имейл.';return}await AU.sendPasswordResetEmail(auth,em.value.trim());er.textContent='Изпратихме писмо за нова парола.'});
  $('out').onclick=async()=>{store=null;await AU.signOut(auth);resetLocal()};
  AU.onAuthStateChanged(auth,async u=>{
    if(!u){store=null;$('app').hidden=true;$('auth').hidden=false;$('out').hidden=true;$('who').textContent='Не си влязъл в профил';setStatus('Влез или се регистрирай, за да виждаш списъка.');return}
    $('auth').hidden=true;$('app').hidden=false;$('out').hidden=false;
    $('who').textContent='Влязъл си като '+(u.email||u.displayName||'')+' ✓';
    let prev=null;try{prev=localStorage.getItem('zoo-uid');localStorage.setItem('zoo-uid',u.uid)}catch(e){}
    if(prev&&prev!==u.uid)resetLocal();
    const ref=FS.doc(fs,'users',u.uid);
    try{
      const snap=await FS.getDoc(ref);
      if(snap.exists()){
        const d=snap.data()||{},lv=state.v,ln=state.n;
        state.v={...(d.v||{})};state.n={...(d.n||{})};
        touched.forEach(k=>{state.v[k]=lv[k];state.n[k]=ln[k]});
        tb.querySelectorAll('tr').forEach(paint);refresh();
        try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}
      }
      store={set:d=>FS.setDoc(ref,d)};
      setStatus('Данните се запазват автоматично в профила ти и се синхронизират между устройствата.');
      if(touched.size||(!snap.exists()&&hasLocal()))save();
    }catch(e){setStatus('Няма достъп до базата данни. Провери правилата на Firestore и връзката.')}
  });
}
initCloud();
